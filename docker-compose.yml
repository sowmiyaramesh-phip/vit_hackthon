version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: atlas_monitor_backend
    environment:
      - DATABASE_URL=sqlite:///./atlas_monitor.db
      - SECRET_KEY=atlas_super_secret_hackathon_key_2026_clinical_intelligence
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend/atlas_monitor.db:/app/backend/atlas_monitor.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas_monitor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
